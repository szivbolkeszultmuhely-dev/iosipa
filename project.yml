name: MomentsPOST02
options:
  bundleIdPrefix: hu.szivbolkeszult
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
targets:
  MomentsPOST02:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      # XcodeGen REGENERATES Info.plist from these properties. It does not
      # preserve entries manually written to Resources/Info.plist.
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: hu
        CFBundleDisplayName: Moments T02 teszt
        CFBundleShortVersionString: '1.0.3'
        CFBundleVersion: '4'
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: 'A Moments POS közvetlen Bluetooth-kapcsolattal csatlakozik az AIMO T02 nyomtatóhoz, hogy próbanyomatot készítsen.'
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.szivbolkeszult.momentspost02
        PRODUCT_NAME: MomentsPOST02
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
